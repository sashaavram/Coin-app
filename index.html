<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DachaMoney">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>DachaMoney</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="warnbar hidden" id="warnbar"></div>

<div id="app">
  <header class="hdr">
    <button class="hbtn" id="menuBtn" aria-label="Menu"></button>
    <div class="hstats">
      <div id="hBalBtn" role="button" aria-label="Choose accounts counted in balance"><div class="lab" id="hBalLab">Balance</div><div class="val num" id="hBal">$ 0</div></div>
      <div><div class="lab">Expenses</div><div class="val num" id="hExp">$ 0</div></div>
      <div><div class="lab">Planned</div><div class="val num" id="hPlan">$ 0</div></div>
    </div>
    <button class="hbtn" id="collapseBtn" aria-label="Collapse income and accounts"></button>
  </header>
  <div class="periodbar">
    <button class="todaydot" id="todayDot" aria-label="Spent today"></button>
    <button id="prevP" aria-label="Previous period">‹</button>
    <button class="plbl" id="periodLbl"></button>
    <button id="nextP" aria-label="Next period">›</button>
    <button class="syncdot" id="syncDot" aria-label="Sync with bank"></button>
  </div>
  <div class="scroll" id="homeScroll">
    <div class="band" id="bandIncome"><div class="grid" id="gridIncome"></div></div>
    <div class="band gray" id="bandAccounts"><div class="grid" id="gridAccounts"></div></div>
    <div class="band"><div class="grid" id="gridCats"></div></div>
    <div class="hint" id="dragHint">Drag an account onto a category to add an expense. Drag income onto an account to add income. Hold a coin to edit.</div>
    <div class="empty hidden" id="homeEmpty"></div>
    <div style="height:calc(70px + env(safe-area-inset-bottom))"></div>
  </div>
</div>
<button class="editdone hidden" id="editDone">Done</button>

<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer"></nav>
<div id="pages"></div>
<div id="overlay"></div>

<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
